<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar un usuario por ID</title>
    <!-- Cargar Bootstrap desde el CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<!-- Contenedor principal, centrado -->
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="row w-100">
        <div class="col-lg-6 col-md-8 col-sm-10 mx-auto bg-white p-4 rounded shadow">
            <h2 class="text-center mb-4">Crear Usuario</h2>

            <!-- Formulario de creación de usuario -->
            <form th:action="@{/sql/vulnerable}" method="post">
                <div class="mb-3">
                    <label for="id" class="form-label">ID del Usuario:</label>
                    <input type="text" id="id" name="id" class="form-control" required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                </div>
            </form>
            <!-- Datos del usuario -->
            <div class="mt-5" th:if="${userForm != null}">
                <h3>Datos del Usuario</h3>
                <p><strong>Nombre:</strong> <span th:text="${userForm.name != null ? userForm.name : 'No disponible'}"></span></p>
                <p><strong>Correo Electrónico:</strong> <span th:text="${userForm.email != null ? userForm.email : 'No disponible'}"></span></p>
            </div>

        </div>
    </div>
</div>

<!-- Cargar Bootstrap JS y dependencias -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
</body>

</html>
