<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultado de Búsqueda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-6 bg-white p-5 rounded shadow">
        <h2 class="mb-4 text-center">Resultado de la Búsqueda</h2>

        <!-- Mostrar datos del usuario -->
        <div th:if="${userForm != null}">
            <ul class="list-group">
                <li class="list-group-item"><strong>ID:</strong> <span th:text="${userForm.id}">1</span></li>
                <li class="list-group-item"><strong>Nombre:</strong> <span th:text="${userForm.name}">Juan Pérez</span></li>
                <li class="list-group-item"><strong>Email:</strong> <span th:text="${userForm.email}">juan@example.com</span></li>
                <!-- Agrega más campos según tu clase User -->
            </ul>
        </div>

        <!-- Mostrar mensaje de error si no hay usuario -->
        <div class="alert alert-danger mt-4" th:if="${error}">
            <p th:text="${error}"></p>
        </div>

        <!-- Botón para volver -->

    </div>
</div>

</body>
</html>
